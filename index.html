<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTS CIEL | Revision Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #020617; color: #f8fafc; overflow: hidden; }
        .cyber-font { font-family: 'Orbitron', sans-serif; }
        
        .portal-bg {
            background: radial-gradient(circle at center, rgba(56, 189, 248, 0.15) 0%, rgba(2, 6, 23, 1) 70%);
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .glow-circle {
            position: absolute;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.2) 0%, transparent 70%);
            filter: blur(40px);
            animation: pulse 4s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }

        .btn-portal {
            position: relative;
            padding: 1rem 3rem;
            background: transparent;
            border: 2px solid #38bdf8;
            color: #38bdf8;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
            overflow: hidden;
            transition: 0.5s;
            cursor: pointer;
            z-index: 10;
        }

        .btn-portal:hover {
            background: #38bdf8;
            color: #020617;
            box-shadow: 0 0 40px rgba(56, 189, 248, 0.6);
        }

        .grid-overlay {
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(rgba(56, 189, 248, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(56, 189, 248, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: 1;
        }

        .floating-data {
            position: absolute;
            font-family: monospace;
            font-size: 10px;
            color: rgba(56, 189, 248, 0.3);
            pointer-events: none;
            z-index: 2;
        }
    </style>
</head>
<body>
    <div class="portal-bg">
        <div class="grid-overlay"></div>
        <div class="glow-circle"></div>
        
        <!-- Floating Elements -->
        <div class="floating-data top-10 left-10">SYSTEM_STATUS: ACTIVE<br>ENCRYPTION: SHA-256<br>NODE_ID: 0x4F2A</div>
        <div class="floating-data bottom-10 right-10">CORE_TEMP: 32°C<br>UPLINK: 1.2 GBPS<br>LOCATION: BTS_CIEL_2026</div>

        <div class="relative z-10 text-center px-4">
            <h1 class="cyber-font text-6xl md:text-8xl font-black mb-2 tracking-tighter text-white">CIEL</h1>
            <p class="cyber-font text-sky-400 text-lg md:text-xl mb-12 tracking-[10px] uppercase">Revision Hub</p>
            
            <div class="max-w-xl mx-auto mb-12 text-slate-400 text-sm md:text-base leading-relaxed">
                Accédez à l'intégralité des ressources de révision pour le BTS Cybersécurité, Informatique et réseaux, Électronique.
            </div>

            <a href="dashboard.html">
                <button class="btn-portal">Entrer</button>
            </a>
        </div>

        <div class="absolute bottom-8 left-0 right-0 text-center z-10">
            <p class="text-[10px] uppercase tracking-widest text-slate-600 font-bold">Développé par Léo - Promotion 2026</p>
        </div>
    </div>

    <script>
        // Simple data floating animation logic if needed
        console.log("Portal Initialized.");
    </script>
</body>
</html>
